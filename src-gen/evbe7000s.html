	.st0 {
		fill: #03234b;

	grid-container {
		display: grid;
		grid-template-columns: auto auto;
		grid-template-rows: auto;
		grid-gap: 10px;
		padding: 10px;
	}

	.grid-container > div {
		text-align: left;
		padding: 20px 0;
	}

	#tooltip {
		background: #fff8dc;
		border: 1px solid #03234b;
		border-radius: 5px;
		padding: 5px;
		font-size: 0.8em;
	}

	.pinText {
		fill: #03234b;
		text-anchor: middle;
	}

	.pinText_start {
		font-size: 0.5em;
		text-anchor: start;
	}

	.pinText_end {
		font-size: 0.5em;
		text-anchor: end;
	}

	text,
	label {
		stroke: #03234b;
		stroke-width: 0.5px;
		font-family: Verdana;
		font-size: 0.8em;
	}

	.configuredPin rect {
		fill: #49b170;
		stroke: #03234b;
		stroke-width: 0.5px;
	}

	.configuredPin > text:nth-child(2) {
		stroke: #03234b;
		fill: #03234b;
		stroke-width: 0.5px;
	}

	.configuredPin > text:nth-child(3) {
		stroke: #49b170;
		fill: #49b170;
		stroke-width: 0.5px;
	}

	.configuredPin:hover rect {
		fill: #ffd200;
		fill-opacity: 1;
		stroke: #03234b;
		stroke-width: 2px;
	}

	.pin {
		stroke: #03234b;
		stroke-width: 0.5px;
		fill-opacity: 1;
	}

	.notConfiguredPin:hover rect {
		fill: #ffd200;
		fill-opacity: 1;
		stroke: #03234b;
		stroke-width: 2px;
	}
	
	.notConfiguredPin text {
		fill: #03234b;
		fill-opacity: 1;
		stroke: #03234b;
	}

	.pinNone {
		fill: #ffffff;
		width: 24px;
		height: 12px;
	}

	.layerPin {
		fill: #3cb4e6;
		stroke: #03234b;
		stroke-width: 0.5px;
		fill-opacity: 0.9;
	}

	.nonConfigurablePin {
		fill: #03234b;
		stroke: #03234b;
	}

	.nonConfigurablePin rect {
		fill: #cccccc;
		stroke: #03234b;
	}

	.nonConfigurablePin > text:nth-child(2) {
		fill: #03234b;
		stroke: #03234b;
		stroke-width: 0.5px;
	}

	.nonConfigurablePin > text:nth-child(3) {
		fill: #03234b;
		stroke: #03234b;
		stroke-width: 0.5px;
	}

	.nonConfigurablePin:hover rect {
		fill: #ffd200;
		fill-opacity: 1;
		stroke: #03234b;
		stroke-width: 2px;
	}

	.board rect {
		fill: #e7017e;
		stroke: #03234b;
		stroke-width: 0.5px;
	}

	.board > text:nth-child(1) {
		fill: #03234b;
		stroke: #03234b;
		stroke-width: 0.5px;
	}

	.board > text:nth-child(3) {
		fill: #e7017e;
		stroke: #e7017e;
		stroke-width: 0.5px;
	}

	.board:hover rect {
		fill: #ffd200;
		fill-opacity: 1;
		stroke: #03234b;
		stroke-width: 2px;
	}
</style>

	function replaceCharByInt(correspondance, p0, p1, p2, p3, p4, decalage, chaine) {
		// Regular expression is: (PAD_P?)([^_]?)(_?)(\d*)
		//                           p1     p2    p3   p4
		// Convert p2 from Alphabetic character to integer (A -> 0, B -> 1...)
		let index = p2.toUpperCase().charCodeAt(0)-65;
		p3 = "_";
		if( index >= 0) {
			return ["PAD_P", index, p3, p4].join('');
		} else {
			return ["PAD_P", p2, p3, p4].join('');
		}
	}
	
	function replaceCharByInt2(correspondance, p1, p2, p3, p4, decalage, chaine) {
		// Regular expression is: (PAD_P?)([^_]?)(_?)(\d*)
		//                           p1     p2    p3   p4
		// Convert p2 from Alphabetic character to integer (A -> 0, B -> 1...)
		let index = p2.toUpperCase().charCodeAt(0)-65;
		p3 = "_";
		if( index >= 0) {
			return ["configured_P", index, p3, p4].join('');
		} else {
			return ["configured_P", p2, p3, p4].join('');
		}
	}
	
	function findElements(name) {
	  	//console.log(name);
		var elArray = [];
		var tmp = document.getElementsByClassName("pin");
		var padName = name.replace(/(^.*)(PAD_P?)([^_]?)(_?)(\d*)/, replaceCharByInt);
		var regex = new RegExp(padName);
		for ( var i = 0; i < tmp.length; i++ ) {
			if ( regex.test(tmp[i].id) ) {
				elArray.push(tmp[i]);
			}
		}
		padName = name.replace(/(PAD_P?)([^\d]?)(_?)(\d*)/, replaceCharByInt2);
		var regex = new RegExp(padName);
		for ( var i = 0; i < tmp.length; i++ ) {
			if ( regex.test(tmp[i].id) ) {
				elArray.push(tmp[i]);
			}
		}
		//console.log(elArray);
		return elArray;
	}
	
	function reset() {
		var input = document.getElementById("padToSelect");
		input.value = "";

	function selectPad() {
		var input = document.getElementById("padToSelect");
		var pad = input.value.toUpperCase();
	
		pad = pad.replace("[", "");
		pad = pad.replace("]", "");
		pad = pad.replace(".*", "");
		pad = pad.replace("*", "");
		pad = pad.concat("$");

			var elt = oldpads[i];
			elt.style.fill = oldcolors[i];
			elt.style.stroke = oldstroke[i];
			elt.style.strokeWidth = oldstrokeWidth[i];
			elt.style.fillOpacity = oldfillOpacity[i];
		}
		oldpads = [];
		oldcolors = [];
		oldstroke = [];
		oldstrokeWidth = [];
		oldfillOpacity = [];
	
		var padName = "^PAD_";
		padName = padName.concat(pad);

		oldpads = pads;
		for ( var i = 0; i < pads.length; i++ ) {
			var elt = pads[i];
			//console.log(elt);
			oldcolors[i] = elt.style.fill;
			oldstroke[i] = elt.style.stroke;
			oldstrokeWidth[i] = elt.style.strokeWidth;
			oldfillOpacity[i] = elt.style.fillOpacity;
			elt.style.fill = '#ffd200';
			elt.style.fillOpacity = '1';
			elt.style.strokeWidth = '2px';
			elt.style.stroke = 'black';
		}
	}

	function changecat(value) {
		if (value.length == 0 || instanceOfPeripherals[value].length == 0) {
			document.getElementById("instance").innerHTML = "<option selected>None</option>";
			document.getElementById("function").innerHTML = "<option selected>None</option>";
		} else {	
			if( instanceOfPeripherals[value].length == 1) {
				var categoryId = instanceOfPeripherals[value][0];
				var catOptions = "<option value=\"All\" selected>" + categoryId + "</option>";
				document.getElementById("instance").innerHTML = catOptions;
				document.getElementById("function").innerHTML = "<option value=\"\">All</option>";
				changeinstance(categoryId);
			} else {
				var catOptions = "<option selected>All</option>";
				for (categoryId in instanceOfPeripherals[value]) {
					catOptions += "<option>" + instanceOfPeripherals[value][categoryId] + "</option>";
				}
				document.getElementById("instance").innerHTML = catOptions;
				document.getElementById("function").innerHTML = "<option value=\"\" selected>All</option>";
			}
		}
	}
	
	function changeinstance(value) {
		if (value.length == 0) {
			document.getElementById("function").innerHTML = "<option selected>All</option>";
		} else {
			var index=document.getElementById("instance").options.selectedIndex
			var periph=document.getElementById("instance").options[index].text
			if( value === "All") {
				//console.log("selected periph:"+selectedPeriph);
				comboPeriph();
			} else if( functionsOfPeripherals[value].length == 1) {
				var categoryId = functionsOfPeripherals[value][0];
				var catOptions = "<option selected>" + categoryId + "</option>";
				document.getElementById("function").innerHTML = catOptions;
			} else {
				var catOptions = "<option selected>All</option>";
				for (categoryId in functionsOfPeripherals[periph]) {
					catOptions += "<option>" + functionsOfPeripherals[periph][categoryId] + "</option>";
				}
				document.getElementById("function").innerHTML = catOptions;
			}
		}
	}
	
	var oldTooltipText = "";
	function stt(evt, pin) { // show tooltip
		let tooltip = document.getElementById("tooltip");
		var text = tooltipsArray[pin];
		if( text ) {
			tooltip.innerHTML = text;
			oldTooltipText = text;
		} else {
			tooltip.innerHTML = oldTooltipText;
		}
		tooltip.style.display = "block";
		tooltip.style.left = evt.pageX + 10 + 'px';
		tooltip.style.top = evt.pageY + 10 + 'px';
	}
	
	function sttConfigured(evt, text) { // show tooltip
		let tooltip = document.getElementById("tooltip");
		if( text ) {
			tooltip.innerHTML = text;
			oldTooltipText = text;
		} else {
			tooltip.innerHTML = oldTooltipText;
		}
		tooltip.style.display = "block";
		tooltip.style.left = evt.pageX + 10 + 'px';
		tooltip.style.top = evt.pageY + 10 + 'px';
	}
	function htt() { // Hide tooltip
		var tooltip = document.getElementById("tooltip");
		tooltip.style.display = "none";
	}
